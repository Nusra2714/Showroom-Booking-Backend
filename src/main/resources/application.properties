spring.application.name=showroom-booking
server.port=${PORT:8080}

# Local development database. Create this database in MySQL first.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pixcom_showroom?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
